<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuminaEther Community</title>
<style>
:root{--bg:#0b0e1a;--p1:#111633;--p2:#1a2147;--ac:#4f8cff;--tx:#e8ecff;--mu:#8b94c4;--ok:#3ddc97;--bad:#ff5c7a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Noto Sans Thai",sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:var(--tx);background:var(--p2);border:1px solid #2b3570;border-radius:8px;padding:8px 10px}
button{cursor:pointer;background:var(--ac);border:0;font-weight:600;transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.15)}
button.g{background:var(--p2);border:1px solid #2b3570}
input,textarea{width:100%;margin:4px 0}small,.mu{color:var(--mu)}
#load{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;transition:opacity .6s}
#load i{width:54px;height:54px;border:4px solid #2b3570;border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card{animation:up .45s both}
#auth{height:100%;display:grid;place-items:center}
#auth .card{width:min(400px,92vw);background:var(--p1);padding:24px;border-radius:16px;box-shadow:0 0 60px #4f8cff33}
#app{display:none;height:100%;grid-template-rows:48px 1fr}
nav{display:flex;gap:6px;align-items:center;padding:0 10px;background:var(--p1);border-bottom:1px solid #222b5c;overflow-x:auto}
nav b{margin-right:auto;white-space:nowrap}nav button{background:none;color:var(--mu)}nav button.on{color:#fff;background:var(--p2)}
main{display:none;height:100%;overflow:auto;padding:16px}main.on{display:block}
#chat.on{display:grid;grid-template-columns:64px 190px 1fr 190px;padding:0}
#chat>div{overflow:auto;padding:8px;min-width:0}#rail{background:#080b16;display:flex;flex-direction:column;gap:8px;align-items:center}
#rail button{width:44px;height:44px;border-radius:50%;padding:0}#rail button.on{border-radius:14px;outline:2px solid #fff}
#side,#mem{background:var(--p1)}#mid{display:flex;flex-direction:column;padding:0!important}
#msgs{flex:1;overflow:auto;padding:10px}#send{display:flex;gap:6px;padding:8px}
.row{padding:5px 8px;border-radius:8px;cursor:pointer}.row:hover,.row.on{background:var(--p2)}
.msg{animation:up .25s both;margin:6px 0}.badge{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--p2);margin-left:4px}
.tick{color:var(--ok)}.banner{height:110px;border-radius:12px;background:linear-gradient(135deg,#1a2147,#4f8cff55) center/cover}
.av{width:72px;height:72px;border-radius:50%;background:var(--p2) center/cover;border:3px solid var(--bg);margin:-36px 0 0 14px}
.box{background:var(--p1);border-radius:12px;padding:12px;margin:10px 0;animation:up .4s both}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}#modal>div{background:var(--p1);padding:18px;border-radius:14px;width:min(420px,92vw);max-height:85vh;overflow:auto}
@media(max-width:760px){#chat.on{grid-template-columns:52px 120px 1fr}#mem{display:none}}
</style></head><body>
<div id="load"><i></i></div><div id="modal"></div>
<div id="auth" style="display:none"><div class="card">
 <h2>LuminaEther Community</h2><small id="amsg" class="mu">เข้าสู่ระบบหรือสมัครสมาชิก</small>
 <div id="reg" style="display:none"><input id="xbox" placeholder="ชื่อ (xbox)"><input id="age" type="number" placeholder="อายุ (oc)"><input id="alias" placeholder="นามแฝง"></div>
 <input id="email" type="email" placeholder="อีเมล"><input id="pw" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)">
 <button id="go" style="width:100%;margin-top:8px">เข้าสู่ระบบ</button>
 <p><a href="#" id="sw" style="color:var(--ac)">ยังไม่มีบัญชี? สมัครสมาชิก</a></p></div></div>
<div id="app"><nav><b>✦ LuminaEther</b>
 <button data-t="chat" class="on">ชุมชน</button><button data-t="news">ข่าวสาร</button><button data-t="me">โปรไฟล์</button><button data-t="people">สมาชิก</button><button data-t="admin" id="adminTab" style="display:none">หลังบ้าน</button><button class="g" id="out">ออก</button></nav>
 <main id="chat" class="on"><div id="rail"></div><div id="side"></div><div id="mid"><div id="msgs"></div><div id="send"><input id="mi" placeholder="พิมพ์ข้อความ..." maxlength="2000"><button id="sb">ส่ง</button></div></div><div id="mem"></div></main>
 <main id="news"></main><main id="me"></main><main id="people"></main><main id="admin"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script></body></html>
