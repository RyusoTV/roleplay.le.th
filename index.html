<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RolePlay Civitas</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<div id="splash"><div class="logo">RolePlay<br>Civitas</div><div class="bar"><i id="bar"></i></div><small id="pct">0%</small></div>
<div id="auth" class="hide"><div class="card"><h1>RolePlay Civitas</h1>
 <div class="tabs"><button id="tL" class="on">เข้าสู่ระบบ</button><button id="tR">สมัครสมาชิก</button></div>
 <form id="fR" class="hide"><input name="display_name" placeholder="ชื่อ (xbox)" required><input name="age" placeholder="อายุ (oc)" required><input name="alias" placeholder="นามแฝง" required>
  <input name="email" type="email" placeholder="อีเมล" required><input name="password" type="password" minlength="6" placeholder="รหัสผ่าน" required><button>ขอรหัส OTP</button></form>
 <form id="fL"><input name="email" type="email" placeholder="อีเมล" required><input name="password" type="password" placeholder="รหัสผ่าน" required><button>ขอรหัส OTP</button></form>
 <form id="fO" class="hide"><p id="otpMsg"></p><input name="token" inputmode="numeric" placeholder="รหัส OTP จากอีเมล" required><button>ยืนยัน</button></form>
 <p id="err" class="err"></p></div></div>
<div id="app" class="hide">
 <nav id="rail"></nav>
 <aside id="side"><header id="srvName"></header><div id="chans"></div><div id="me"></div></aside>
 <main><header id="top"><button id="menu">☰</button><b id="chName"></b><span class="sp"></span><button id="vcBtn" class="hide">🎤 เข้าห้องเสียง</button><button id="scr" class="hide">🖥 แชร์จอ</button><button id="memBtn">👥</button></header>
  <div id="msgs"></div><div id="reply" class="hide"></div>
  <form id="send"><label class="ic">＋<input type="file" id="file" hidden></label><input id="txt" placeholder="ส่งข้อความ... (@ชื่อ เพื่อแท็ก)" autocomplete="off"><button>ส่ง</button></form>
  <div id="vc" class="hide"></div></main>
 <aside id="mem" class="hide"></aside></div>
<div id="modal" class="hide"><div class="box"><button class="x" onclick="modal.classList.add('hide')">✕</button><div id="mbody"></div></div></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
