<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuminaEther</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="auth-wrap">
    <section class="hero fade-up">
      <h1>LuminaEther</h1>
      <p>ชุมชนของคุณ ยศของคุณ โปรไฟล์ของคุณ ทุกอย่างอยู่ในที่เดียว</p>
    </section>

    <section class="card auth-card fade-up delay">
      <div class="tabs">
        <button id="tab-signup" class="tab active" type="button">สมัครสมาชิก</button>
        <button id="tab-login" class="tab" type="button">เข้าสู่ระบบ</button>
      </div>

      <form id="signup-form" class="stack">
        <label>ชื่อ (Xbox)
          <input name="xbox_name" required maxlength="32" autocomplete="off">
        </label>
        <label>อายุ (13 ปีขึ้นไป)
          <input name="age" type="number" min="13" max="120" required>
        </label>
        <label>นามแฝง (3–20 ตัว: a-z, 0-9, _)
          <input name="alias" required pattern="[A-Za-z0-9_]{3,20}" autocomplete="off">
        </label>
        <label>อีเมล
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label>รหัสผ่าน (อย่างน้อย 8 ตัว)
          <input name="password" type="password" minlength="8" required autocomplete="new-password">
        </label>
        <button class="btn primary" type="submit">สร้างบัญชี</button>
      </form>

      <form id="login-form" class="stack hidden">
        <label>อีเมล
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label>รหัสผ่าน
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <button class="btn primary" type="submit">เข้าสู่ระบบ</button>
      </form>

      <p id="auth-msg" class="msg" role="status"></p>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
