name: CI and Pages deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the C++ alias validator
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -o alias_check native/alias_check.cpp
          ./alias_check --test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python script
        run: |
          python -m pip install requests
          python -m py_compile scripts/promote.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
